<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Parked</title>
<style>
:root{--bg:#EEF1F6;--card:#fff;--ink:#16202F;--mute:#6B778C;--line:#DCE1EA;--acc:#2F4BFF;--todo:#8791A5;--doing:#E39B0B;--done:#16977F}
@media(prefers-color-scheme:dark){:root{--bg:#0E131C;--card:#171E2B;--ink:#E8ECF4;--mute:#8C97AB;--line:#263042;--acc:#7189FF}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
#app{max-width:640px;margin:auto;padding:env(safe-area-inset-top) 16px calc(130px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px;padding:18px 0 12px}
h1{flex:1;margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ic{font-size:22px;padding:6px 10px;text-decoration:none;color:var(--ink)}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:inherit}
.card b{font-size:18px}.card small{color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--line);margin:10px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--done)}
.empty{color:var(--mute);text-align:center;padding:48px 16px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--acc);color:#fff;font-weight:700;padding:14px 26px;border-radius:30px;box-shadow:0 6px 20px #0004}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.tabs button{white-space:nowrap;padding:7px 13px;border-radius:20px;border:1px solid var(--line);color:var(--mute);background:var(--card)}
.tabs .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px 10px 10px;margin-bottom:8px}
li span{flex:1;word-break:break-word}.dn{text-decoration:line-through;color:var(--mute)}
.pill{flex:none;font-size:12px;font-weight:700;color:#fff;padding:5px 10px;border-radius:12px;min-width:92px}
.pill.todo{background:var(--todo)}.pill.doing{background:var(--doing)}.pill.done{background:var(--done)}
.x{color:var(--mute);padding:6px 10px}
.add{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;max-width:640px;margin:auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.add input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.mic{font-size:20px;width:48px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.mic.live{background:#E5484D;animation:p 1s infinite}@keyframes p{50%{opacity:.5}}
.go{background:var(--acc);color:#fff;font-weight:700;padding:0 18px;border-radius:12px}
.foot{display:flex;gap:16px;justify-content:center;margin-top:24px}.foot button{color:var(--mute);font-size:14px;text-decoration:underline}
</style></head><body><div id="app"></div><input type="file" id="imp" accept=".json" hidden>
<script>
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ST=['todo','doing','done'],LB={todo:'To do',doing:'In progress',done:'Done'};
const ago=t=>{const d=Math.floor((Date.now()-t)/864e5);return d<1?'today':d==1?'yesterday':d+' days ago'};
let db,P=[],filter='all',rec=null;
const openDB=()=>new Promise((ok,no)=>{const r=indexedDB.open('parked',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const store=m=>db.transaction('p',m).objectStore('p');
const load=()=>new Promise(ok=>{const q=store('readonly').getAll();q.onsuccess=()=>ok(q.result)});
const save=p=>{p.updated=Date.now();store('readwrite').put(p)};
const cur=()=>P.find(p=>p.id===location.hash.slice(3));

function home(){
  const list=[...P].sort((a,b)=>b.updated-a.updated);
  $('#app').innerHTML=`<header><h1>Parked</h1></header>`+
  (list.length?list.map(p=>{const n=p.f.length,d=p.f.filter(x=>x.s=='done').length;
    return `<a class="card" href="#p/${p.id}"><b>${esc(p.name)}</b><div class="bar"><i style="width:${n?d/n*100:0}%"></i></div><small>${d} of ${n} done, last touched ${ago(p.updated)}</small></a>`}).join('')
   :`<p class="empty">No projects yet. Add the one you keep meaning to finish.</p>`)+
  `<div class="foot"><button data-a="exp">Export backup</button><button data-a="imp">Import backup</button></div>
   <button class="fab" data-a="newp">+ New project</button>`;
}
function proj(p){
  const c=s=>p.f.filter(x=>x.s==s).length,o={doing:0,todo:1,done:2};
  const fs=p.f.filter(x=>filter=='all'||x.s==filter).sort((a,b)=>o[a.s]-o[b.s]||a.t-b.t);
  $('#app').innerHTML=`<header><a class="ic" href="#">←</a><h1>${esc(p.name)}</h1><button class="ic" data-a="delp" aria-label="Delete project">🗑</button></header>
  <div class="tabs">${['all',...ST].map(k=>`<button class="${filter==k?'on':''}" data-a="flt" data-k="${k}">${k=='all'?'All '+p.f.length:LB[k]+' '+c(k)}</button>`).join('')}</div>
  <ul>${fs.map(x=>`<li><button class="pill ${x.s}" data-a="cyc" data-id="${x.id}">${LB[x.s]}</button><span class="${x.s=='done'?'dn':''}" data-a="edit" data-id="${x.id}">${esc(x.n)}</span><button class="x" data-a="delf" data-id="${x.id}" aria-label="Delete feature">✕</button></li>`).join('')||''}</ul>
  ${fs.length?'':'<p class="empty">Nothing here yet. Type or speak a feature below.</p>'}
  <form class="add" id="af"><input id="in" placeholder="Add a feature" autocomplete="off"><button type="button" class="mic" data-a="mic" aria-label="Voice input">🎤</button><button class="go">Add</button></form>`;
}
function render(){const d=$('#in')?.value;const p=cur();
  if(location.hash.startsWith('#p/')&&p){proj(p);if(d)$('#in').value=d}else home()}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,p=cur(),f=p&&p.f.find(x=>x.id==b.dataset.id);
  if(a=='newp'){const n=(prompt('Project name')||'').trim();if(n){const q={id:uid(),name:n,f:[],created:Date.now(),updated:Date.now()};P.push(q);save(q);location.hash='p/'+q.id}return}
  if(a=='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(P)],{type:'application/json'}));l.download='parked-backup.json';l.click();return}
  if(a=='imp'){$('#imp').click();return}
  if(a=='mic'){mic(b);return}
  if(!p)return;
  if(a=='flt')filter=b.dataset.k;
  if(a=='cyc'&&f){f.s=ST[(ST.indexOf(f.s)+1)%3];save(p)}
  if(a=='edit'&&f){const n=prompt('Edit feature',f.n);if(n&&n.trim()){f.n=n.trim();save(p)}}
  if(a=='delf'&&f&&confirm('Delete this feature?')){p.f=p.f.filter(x=>x!==f);save(p)}
  if(a=='delp'&&confirm('Delete "'+p.name+'" and all its features?')){store('readwrite').delete(p.id);P=P.filter(x=>x!==p);location.hash='';return}
  render();
});
document.addEventListener('submit',e=>{
  if(e.target.id!='af')return;e.preventDefault();
  const p=cur(),v=$('#in').value.trim();if(!v)return;
  p.f.push({id:uid(),n:v,s:'todo',t:Date.now()});save(p);$('#in').value='';render();$('#in').focus();
});
function mic(btn){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R)return alert('Voice input is not supported in this browser. Try Chrome on Android.');
  if(rec){rec.stop();return}
  rec=new R();rec.lang='en-IN';rec.interimResults=false;btn.classList.add('live');
  rec.onresult=e=>{const t=[...e.results].map(r=>r[0].transcript).join(' ');$('#in').value=($('#in').value+' '+t).trim()};
  rec.onend=()=>{rec=null;btn.classList.remove('live')};
  rec.onerror=()=>alert('Could not hear that. Check microphone permission and internet connection.');
  rec.start();
}
$('#imp').onchange=async e=>{
  try{const arr=JSON.parse(await e.target.files[0].text());
    if(!Array.isArray(arr))throw 0;
    for(const q of arr){if(q.id&&q.name&&Array.isArray(q.f)){store('readwrite').put(q);const i=P.findIndex(x=>x.id==q.id);i<0?P.push(q):P[i]=q}}
    render();
  }catch{alert('That file is not a Parked backup.')}
  e.target.value='';
};
addEventListener('hashchange',()=>{filter='all';render()});
(async()=>{db=await openDB();P=await load();render();
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
